<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FWI Prediction</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(rgba(10, 45, 35, 0.65),
                                rgba(10, 45, 35, 0.65)),
                url("https://images.unsplash.com/photo-1448375240586-882707db888b");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login {

            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.96);

            padding: 25px 30px;

            border-radius: 18px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);

            text-align: center;
        }

        .fire-icon {
            font-size: 32px;
            margin-bottom: 3px;
        }

        h1 {
            color: #1b5e20;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 18px;
        }

        form {
            width: 100%;
        }

        input {
            width: 100%;

            height: 38px;

            padding: 8px 12px;

            margin-bottom: 6px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

            outline: none;
        }

        input:focus {
            border-color: #4caf50;

            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        input::placeholder {
            color: #888;
        }

        button {

            width: 100%;

            height: 42px;

            margin-top: 6px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #2e7d32,
                #66bb6a
            );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow: 0 6px 15px rgba(46, 125, 50, 0.35);
        }

        .result {

            margin-top: 14px;

            padding: 10px;

            background: #f1f8e9;

            border: 1px solid #a5d6a7;

            border-radius: 10px;
        }

        .result-title {

            color: #555;

            font-size: 14px;

            margin-bottom: 3px;
        }

        .result-value {

            color: #2e7d32;

            font-size: 22px;

            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="login">

        <div class="fire-icon">
            🔥
        </div>

        <h1>
            FWI Prediction
        </h1>

        <p class="subtitle">
            Enter environmental parameters to predict the Fire Weather Index
        </p>


        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <input
                type="text"
                name="Temperature"
                placeholder="Temperature"
                required
            >

            <input
                type="text"
                name="RH"
                placeholder="Relative Humidity (RH)"
                required
            >

            <input
                type="text"
                name="Ws"
                placeholder="Wind Speed (Ws)"
                required
            >

            <input
                type="text"
                name="Rain"
                placeholder="Rain"
                required
            >

            <input
                type="text"
                name="FFMC"
                placeholder="FFMC"
                required
            >

            <input
                type="text"
                name="DMC"
                placeholder="DMC"
                required
            >

            <input
                type="text"
                name="ISI"
                placeholder="ISI"
                required
            >

            <input
                type="text"
                name="Classes"
                placeholder="Classes"
                required
            >

            <input
                type="text"
                name="Region"
                placeholder="Region"
                required
            >


            <button type="submit">
                🔥 Predict FWI
            </button>

        </form>


        <div class="result">

            <div class="result-title">
                THE FWI prediction is
            </div>

            <div class="result-value">
                {{ results }}
            </div>

        </div>

    </div>

</body>

</html>
